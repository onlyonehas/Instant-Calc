name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - run: npm run audit

      - name: Auto-fix safe semver-compatible vulnerabilities
        run: npm audit fix || true

      - name: Commit fixes if any
        run: |
          if ! git diff --quiet; then
            git config user.name "audit-fix-bot"
            git config user.email "bot@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: npm audit fix [skip ci]"
            git push
          fi
